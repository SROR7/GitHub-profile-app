name: Docker Image CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: docker

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASS }}

    steps:

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Check Docker secrets
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME is EMPTY"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "DOCKER_PASSWORD is EMPTY"
            exit 1
          fi

          echo "Docker credentials are configured"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build \
            -t "$DOCKER_USERNAME/gitdev-frontend:latest" \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push "$DOCKER_USERNAME/gitdev-frontend:latest"

      - name: Build Backend Image
        run: |
          docker build \
            -t "$DOCKER_USERNAME/gitdev-backend:latest" \
            ./backend

      - name: Push Backend Image
        run: |
          docker push "$DOCKER_USERNAME/gitdev-backend:latest"

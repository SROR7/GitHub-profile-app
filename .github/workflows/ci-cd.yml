name: Docker Image CI

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker username
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME is EMPTY"
            exit 1
          fi

          echo "Docker username is configured"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build \
            -t "$DOCKER_USERNAME/gitdev-frontend:latest" \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push "$DOCKER_USERNAME/gitdev-frontend:latest"

      - name: Build Backend Image
        run: |
          docker build \
            -t "$DOCKER_USERNAME/gitdev-backend:latest" \
            ./backend

      - name: Push Backend Image
        run: |
          docker push "$DOCKER_USERNAME/gitdev-backend:latest"

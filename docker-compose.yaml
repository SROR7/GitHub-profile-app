services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitdev-backend

    ports:
      - "3000:3000"


    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile

    container_name: Gitdev-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped
